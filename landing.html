<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #0073e6;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
        }
        .hero {
            padding: 60px 20px;
            text-align: center;
            background-color: #f4f4f4;
        }
        .hero h1 {
            font-size: 2.5rem;
        }
        .hero p {
            margin: 15px 0;
            font-size: 1rem;
        }
        .hero a {
            padding: 10px 20px;
            background-color: #0073e6;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .features {
            padding: 40px 20px;
            background-color: #fff;
            text-align: center;
        }
        .features h2 {
            margin-bottom: 20px;
        }
        .features ul {
            list-style: none;
            padding: 0;
        }
        .features li {
            margin: 10px 0;
        }
        footer {
            padding: 15px;
            background-color: #333;
            color: white;
            text-align: center;
        }
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2rem;
            }
            .hero p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">My Website</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to My Website</h1>
        <p>Your journey to innovation starts here.</p>
        <a href="#">Get Started</a>
    </section>

    <section class="features">
        <h2>Features</h2>
        <ul>
            <li>Innovative Solutions</li>
            <li>User-Friendly Design</li>
            <li>Responsive and Adaptive</li>
        </ul>
    </section>

    <footer>
        <p>&copy; 2025 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
